[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revenant-client"
version = "0.0.1"
description = "A basic python MUD client made just for fun"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jonas A Andersson", email = "jonas@andersson.io" },
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "keyring>=25.7.0",
    "networkx>=3.4.2",
    "pyqt6",
    "pyqt6-webengine",
    "pyyaml",
    # zoneinfo's timezone database, absent from the OS on Windows.
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/jandersson/revenant"

[project.scripts]
revenant = "client.launch:main"
revenant-chat = "client.gui.chat_window:main"
revenant-send = "client.sendcmd:main"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["client"]
