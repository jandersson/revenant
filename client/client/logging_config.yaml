version: 1
formatters:
  game:
    format: "%(message)s"
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%d-%b-%y %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: default
    stream: ext://sys.stdout
  file:
    class : logging.handlers.RotatingFileHandler
    formatter: default
    filename: revenant_client.log
    maxBytes: 10485760
    backupCount: 3
    delay: true
  game_file:
    # Append-only archive: one file per process/session, never rotated
    # away. The filename is stamped in client_logger._init_logger.
    class : logging.FileHandler
    formatter: game
    filename: revenant_game.log
    delay: true
loggers:
  game:
    level: DEBUG
    handlers: [game_file]
    propagate: no
root:
  level: DEBUG
  handlers: [console, file]