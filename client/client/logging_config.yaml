version: 1
formatters:
  game:
    format: "%(message)s"
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%d-%b-%y %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: default
    stream: ext://sys.stdout
  file:
    # Disposable debug log: one file per process (stamp+pid, #74) so
    # rotation never contends across sessions on Windows; old ones are
    # pruned at init. Filename is stamped in client_logger._init_logger.
    class : logging.handlers.RotatingFileHandler
    formatter: default
    filename: revenant_client.log
    maxBytes: 10485760
    backupCount: 3
    delay: true
    encoding: utf-8
  game_file:
    # Append-only archive: one file per process/session, never rotated
    # away. The filename is stamped in client_logger._init_logger.
    class : logging.FileHandler
    formatter: game
    filename: revenant_game.log
    delay: true
    # The game's text is decoded from cp1252 (core.GAME_ENCODING); a byte
    # it leaves undefined arrives as U+FFFD, which only UTF-8 can write.
    encoding: utf-8
loggers:
  game:
    level: DEBUG
    handlers: [game_file]
    propagate: no
root:
  level: DEBUG
  handlers: [console, file]