version: 1
formatters:
  game:
    format: "%(message)s"
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%d-%b-%y %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: default
    stream: ext://sys.stdout
  file:
    class : logging.handlers.RotatingFileHandler
    formatter: default
    filename: revenant_client.log
    maxBytes: 10485760
    backupCount: 3
  game_file:
    class : logging.handlers.RotatingFileHandler
    formatter: game
    filename: revenant_game.log
    maxBytes: 52428800
    backupCount: 10
loggers:
  game:
    level: DEBUG
    handlers: [game_file]
    propagate: no
root:
  level: DEBUG
  handlers: [console, file]