<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The moons of Elanthia, flat for small sizes (2026-09-26):
       black Katamba as a crescent ringed in miasma, crimson Yavash,
       blue Xibar, and a shard of Grazhir. -->
  <rect width="512" height="512" rx="114" fill="#1a1d31"/>

  <!-- Katamba: one faint ring of miasma, a heavy rim, a near-black body -->
  <path d="M 262,108 A 150,150 0 1,1 262,404 A 184,184 0 0,0 262,108 Z"
        fill="none" stroke="#9a8fc0" stroke-opacity="0.22" stroke-width="30"/>
  <path d="M 262,108 A 150,150 0 1,1 262,404 A 184,184 0 0,0 262,108 Z"
        fill="#0a0a13" stroke="#c9c1ea" stroke-width="12"/>

  <!-- Yavash, the crimson moon -->
  <circle cx="132" cy="148" r="74" fill="#e0505a" opacity="0.18"/>
  <circle cx="132" cy="148" r="58" fill="#d9404a"/>
  <circle cx="114" cy="130" r="18" fill="#f07a80"/>

  <!-- Xibar, the blue moon -->
  <circle cx="142" cy="364" r="56" fill="#8fb8ff" opacity="0.18"/>
  <circle cx="142" cy="364" r="40" fill="#a9c4ff"/>
  <circle cx="130" cy="352" r="12" fill="#dbe6ff"/>

  <!-- Grazhir's shards -->
  <path d="M414,92 L427,126 L461,139 L427,152 L414,186 L401,152 L367,139 L401,126 Z" fill="#f3f1ff"/>
  <path d="M452,204 L457,217 L470,222 L457,227 L452,240 L447,227 L434,222 L447,217 Z" fill="#cfd4f5"/>
</svg>
