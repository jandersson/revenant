<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A kyanite gwethdesuan, per Elanthipedia's item entry: "a fine silver
       chain meant to be worn on the head, with a pair of tiny kyanite
       stones in star-shaped settings which rest over the temples,
       magnifying one's thoughts."
       References: a ferronniere (Leonardo's La Belle Ferronniere) for
       how a fine chain sits across the brow, and a jeweller's star-set
       ring for the setting: the stone flush, an eight-pointed star cut
       into the metal around it, four long rays and four short.
       Three-quarter view as in the painting: the chain crosses the brow
       and wraps away, the near temple's setting large, the far one
       small and foreshortened. Jewellery, not a gadget: no glow. -->
  <defs>
    <radialGradient id="stone" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#eaf7ff"/>
      <stop offset="35%" stop-color="#5ab9ea"/>
      <stop offset="75%" stop-color="#1f5e93"/>
      <stop offset="100%" stop-color="#0d2a45"/>
    </radialGradient>
    <radialGradient id="disc" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="55%" stop-color="#c9cbd4"/>
      <stop offset="100%" stop-color="#70738a"/>
    </radialGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9dbe3"/>
      <stop offset="60%" stop-color="#aeb1bd"/>
      <stop offset="100%" stop-color="#7a7d8e"/>
    </linearGradient>
    <!-- a star setting: a small round silver mount, the stone flush, an
         eight-pointed star cut into the metal (four long rays, four
         short); rays bright on one edge, dark on the other, as a cut is -->
    <g id="setting">
      <circle r="9" fill="url(#disc)" stroke="#3a3d4b" stroke-width="0.8"/>
      <g stroke="#2c2f3c" stroke-width="1.1" stroke-linecap="round">
        <line x1="0" y1="-3.6" x2="0" y2="-8"/>
        <line x1="0" y1="3.6" x2="0" y2="8"/>
        <line x1="-3.6" y1="0" x2="-8" y2="0"/>
        <line x1="3.6" y1="0" x2="8" y2="0"/>
        <line x1="-2.5" y1="-2.5" x2="-5" y2="-5"/>
        <line x1="2.5" y1="-2.5" x2="5" y2="-5"/>
        <line x1="-2.5" y1="2.5" x2="-5" y2="5"/>
        <line x1="2.5" y1="2.5" x2="5" y2="5"/>
      </g>
      <g stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.7">
        <line x1="0.6" y1="-3.6" x2="0.6" y2="-7.8"/>
        <line x1="0.6" y1="3.6" x2="0.6" y2="7.8"/>
        <line x1="-3.6" y1="-0.6" x2="-7.8" y2="-0.6"/>
        <line x1="3.6" y1="-0.6" x2="7.8" y2="-0.6"/>
      </g>
      <circle r="3.3" fill="url(#stone)" stroke="#0a2340" stroke-width="0.6"/>
      <circle cx="-1.1" cy="-1.2" r="0.9" fill="#ffffff" opacity="0.9"/>
    </g>
  </defs>
  <!-- the chain across the brow, wrapping away to the far temple: fine,
       with links -->
  <path d="M2 30 C 14 36, 30 34, 46 28 S 60 20, 63 16" fill="none" stroke="#3a3d4b" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M2 30 C 14 36, 30 34, 46 28 S 60 20, 63 16" fill="none" stroke="url(#chain)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M2 30 C 14 36, 30 34, 46 28 S 60 20, 63 16" fill="none" stroke="#2c2f3c" stroke-width="0.7" stroke-dasharray="1.3 1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- the far temple's setting, small, foreshortened -->
  <use href="#setting" transform="translate(52 24) scale(0.55 0.5)"/>
  <!-- the near temple's setting, large, in the foreground -->
  <use href="#setting" transform="translate(17 34) scale(1.35)"/>
</svg>
