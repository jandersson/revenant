<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A kyanite gwethdesuan, per Elanthipedia's item entry: "a fine silver
       chain meant to be worn on the head, with a pair of tiny kyanite
       stones in star-shaped settings which rest over the temples,
       magnifying one's thoughts." Seen close and at an angle so it does
       not read as a face: a length of the silver chain runs diagonally,
       the nearer star setting large in the foreground, the farther one
       small along the chain. Each setting is an eight-pointed silver
       star with the stone set flush at its centre. -->
  <defs>
    <radialGradient id="stone" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="40%" stop-color="#4fb8ef"/>
      <stop offset="80%" stop-color="#1b5f9a"/>
      <stop offset="100%" stop-color="#0c2c49"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f7fa"/>
      <stop offset="45%" stop-color="#bfc1cc"/>
      <stop offset="100%" stop-color="#63667a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fd6ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8fd6ff" stop-opacity="0"/>
    </radialGradient>
    <!-- an eight-pointed star setting, unit size: outer points r=10, inner r=6 -->
    <g id="star">
      <polygon points="0,-10 2.3,-5.5 7.1,-7.1 5.5,-2.3 10,0 5.5,2.3 7.1,7.1 2.3,5.5 0,10 -2.3,5.5 -7.1,7.1 -5.5,2.3 -10,0 -5.5,-2.3 -7.1,-7.1 -2.3,-5.5"
               fill="url(#silver)" stroke="#3f4250" stroke-width="0.8" stroke-linejoin="round"/>
      <circle r="5.2" fill="none" stroke="#4a4d5a" stroke-width="0.6" opacity="0.8"/>
      <circle r="3.6" fill="url(#stone)" stroke="#0b2540" stroke-width="0.6"/>
      <circle cx="-1.1" cy="-1.3" r="1" fill="#ffffff" opacity="0.85"/>
    </g>
  </defs>
  <!-- the chain: one length of the circlet, seen at an angle -->
  <path d="M4 52 C 18 46, 30 30, 58 12" fill="none" stroke="#5a5d6a" stroke-width="4" stroke-linecap="round"/>
  <path d="M4 52 C 18 46, 30 30, 58 12" fill="none" stroke="url(#silver)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M4 52 C 18 46, 30 30, 58 12" fill="none" stroke="#3f4250" stroke-width="1" stroke-dasharray="2.2 2.4" stroke-linecap="round" opacity="0.7"/>
  <!-- the farther setting, small, along the chain -->
  <circle cx="47" cy="19" r="8" fill="url(#glow)"/>
  <use href="#star" transform="translate(47 19) scale(0.55)"/>
  <!-- the nearer setting, large, in the foreground -->
  <circle cx="22" cy="40" r="19" fill="url(#glow)"/>
  <use href="#star" transform="translate(22 40) scale(1.5)"/>
  <!-- the magnified thought: ripples rising from the near stone -->
  <path d="M30 22 q 5 -4 10 0" fill="none" stroke="#8fd6ff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M27 16 q 7 -5 14 0" fill="none" stroke="#8fd6ff" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <path d="M24 10 q 9 -6 18 0" fill="none" stroke="#8fd6ff" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
</svg>
