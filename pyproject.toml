[tool.uv.workspace]
members = ["client", "chat", "beholder"]

[tool.uv]
# Workspace-wide dev tools. Per-member dev deps live in each member's
# pyproject.toml under [dependency-groups].
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]
# The docs site (#97): uv run --group docs mkdocs build
docs = [
    "mkdocs-material",
]

[tool.ruff]
line-length = 88
# Scratch notebooks are not part of the linted codebase.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
