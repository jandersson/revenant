# This workflow installs dependencies with uv, runs tests, and lints.
# See: https://docs.astral.sh/uv/guides/integration/github/

name: Python package

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # client/login.py uses telnetlib, which was removed in Python 3.13.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint with ruff
        run: uv run ruff check client chat

      - name: Check formatting with ruff
        run: uv run ruff format --check client chat

      - name: Test with pytest
        working-directory: client
        run: uv run pytest
