# This workflow installs dependencies with uv, runs tests, and lints.
# See: https://docs.astral.sh/uv/guides/integration/github/

name: Python package

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # client/login.py uses telnetlib, which was removed in Python 3.13.
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # The macOS leg (#84): Docker can't containerize macOS, so CI
          # covers it — one Python, since the OS differences we guard
          # against (case-insensitive fs, socket-close semantics) don't
          # vary by Python version.
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint with ruff
        run: uv run ruff check client chat beholder

      - name: Check formatting with ruff
        run: uv run ruff format --check client chat beholder

      - name: Test with pytest
        working-directory: client
        run: uv run pytest

      - name: Test beholder with pytest
        working-directory: beholder
        run: uv run pytest

      - name: Test chat with pytest
        run: uv run pytest chat/tests
