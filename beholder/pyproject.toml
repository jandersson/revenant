[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revenant-beholder"
version = "0.0.1"
description = "Dash dashboard for DragonRealms skill experience history"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jonas A Andersson", email = "jonas@andersson.io" },
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "dash>=3.0",
    "dash-ag-grid>=35.3.0",
]

[project.urls]
Repository = "https://github.com/jandersson/revenant"

[project.scripts]
beholder = "beholder.app:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["beholder"]
